<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión del negocio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEDF4; --surface:#FFFFFF; --surface-2:#F6F5FA; --ink:#221F2E; --muted:#625E73; --line:#DAD6E4;
  --brand:#5B4B8A; --brand-ink:#FFFFFF; --brand-soft:#E6E2F1;
  --side:#2E2747; --side-ink:#ECE9F5; --side-muted:#ABA4C6; --side-active:#463C6B;
  --pos:#1B7A4B; --pos-soft:#DCF0E4; --neg:#B23A2E; --neg-soft:#F8E1DD; --warn:#8F5A00; --warn-soft:#FBEBC8;
  --focus:#1F7FD6; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151320; --surface:#1E1B2B; --surface-2:#252235; --ink:#E9E7F2; --muted:#9C98B0; --line:#35314C;
    --brand:#A293DA; --brand-ink:#15101F; --brand-soft:#2C2746;
    --side:#100E19; --side-ink:#E3E0EF; --side-muted:#8B86A5; --side-active:#2B2645;
    --pos:#4CC38A; --pos-soft:#153427; --neg:#F08A7E; --neg-soft:#3A1E1B; --warn:#E7B04A; --warn-soft:#3A2D10;
    --focus:#5AB0F5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151320; --surface:#1E1B2B; --surface-2:#252235; --ink:#E9E7F2; --muted:#9C98B0; --line:#35314C;
  --brand:#A293DA; --brand-ink:#15101F; --brand-soft:#2C2746;
  --side:#100E19; --side-ink:#E3E0EF; --side-muted:#8B86A5; --side-active:#2B2645;
  --pos:#4CC38A; --pos-soft:#153427; --neg:#F08A7E; --neg-soft:#3A1E1B; --warn:#E7B04A; --warn-soft:#3A2D10;
  --focus:#5AB0F5; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:24px 14px 16px}
.brand{padding:0 10px 24px}
.brand-name{display:block;font-size:19px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.brand-sub{font-size:13px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.foot-btn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--side-ink);font-weight:500;cursor:pointer;text-align:left}
.nav button:hover,.foot-btn:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:var(--side-active);font-weight:600}
.badge{margin-left:auto;background:var(--warn-soft);color:var(--warn);border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px}
.side-foot{margin-top:auto}
.save-note{font-size:12.5px;color:var(--side-muted);padding:8px 12px 0}

.main{padding:30px 38px 70px;max-width:1260px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:27px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.top-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--neg);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--neg-soft)}
.btn.danger-solid{background:var(--neg);border-color:var(--neg);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13.5px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{width:32px;height:32px;border:0;border-radius:7px;background:transparent;font-size:22px;line-height:1;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:38px;max-width:100%}
input[type=checkbox]{min-height:0;width:17px;height:17px;accent-color:var(--brand)}
select{padding-right:6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.panel-h h3{font-size:15.5px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}

.hero{margin:0 0 28px;max-width:66ch}
.hero-line{font-size:31px;line-height:1.27;font-weight:500;letter-spacing:-.012em;margin-bottom:12px}
.hero-line b{font-weight:700}
.hero-sub{font-size:18px;color:var(--muted);line-height:1.45}
.hero-sub b{color:var(--ink);font-weight:600}
.delta{margin-top:12px;font-weight:600;font-size:14.5px}
.pos-t{color:var(--pos)}.neg-t{color:var(--neg)}.warn-t{color:var(--warn)}.mute{color:var(--muted)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.toolbar .grow{flex:1 1 200px}
.stats{display:flex;gap:38px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.stat b{display:block;font-size:22px;font-weight:700;line-height:1.25}
.stat span{color:var(--muted);font-size:13px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:13px;font-weight:500;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl td.r{white-space:nowrap}
.tbl td.seg{max-width:230px}.tbl td.seg .chip{white-space:normal}
.tbl .sub-l{display:block;font-size:12.5px;color:var(--muted)}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line);background:var(--surface-2)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos)}.chip.neg{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}

.hbar{height:8px;border-radius:99px;background:var(--brand-soft);overflow:hidden}
.hbar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.hbar.neg{background:var(--neg-soft)}.hbar.neg>i{background:var(--neg)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .hbar{grid-column:1/-1}
.lbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500}
.lbtn:hover{text-decoration:underline}
.chart{width:100%;height:auto;display:block}
.flow-r{display:flex;justify-content:space-between;font-weight:500;margin:10px 0 6px}
.flow-r b{font-weight:700}
.note{font-size:13px;color:var(--muted)}

.cajas{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px;margin-bottom:20px}
.caja-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.saldo{font-size:27px;font-weight:700;margin:6px 0 12px;line-height:1.2}
.caja-a{display:flex;gap:6px}

.welcome{max-width:640px;margin:7vh auto 0}
.welcome h1{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-.015em;margin-bottom:14px}
.welcome p{font-size:17px;color:var(--muted);margin-bottom:14px}
.welcome ol{padding-left:22px;margin:0 0 24px;font-size:16px}
.welcome li{margin-bottom:6px}
.welcome .fld{margin-bottom:16px;max-width:380px}
.welcome .actions{display:flex;gap:10px;flex-wrap:wrap}

.overlay{position:fixed;inset:0;background:rgba(6,20,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px;overflow:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(540px,100%);box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .14s ease-out}
.modal.wide{width:min(880px,100%)}.modal.small{width:min(430px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 14px 22px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:19px;font-weight:700}
.m-body{padding:20px 22px}
.m-body p{color:var(--muted)}
.m-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid.c3{grid-template-columns:1.4fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.fld.full{grid-column:1/-1}
.hint{font-size:13px;color:var(--muted);margin-top:2px}
.err{background:var(--neg-soft);color:var(--neg);padding:10px 12px;border-radius:8px;margin-top:14px;font-weight:600}
.warnbox{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:8px;margin-top:12px;font-weight:500;font-size:14px}
.items{margin-top:20px}
.irow,.ihead{display:grid;grid-template-columns:minmax(0,1fr) 88px 118px 118px 34px;gap:8px;align-items:center;margin-bottom:8px}
.ihead{font-size:13px;font-weight:600;color:var(--muted)}
.irow .sub{text-align:right;font-weight:600}
.irow.warn select{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.totbox{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.totbox .big{font-size:30px;font-weight:700;line-height:1.1}
.chk{display:flex;align-items:center;gap:9px;margin-top:14px;font-weight:500}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:18px 0}
.ag{display:flex;gap:26px;flex-wrap:wrap;margin:0 0 14px}
.ag div span{display:block;font-size:12.5px;color:var(--muted)}.ag div b{font-size:17px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;z-index:90;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:translateX(-50%)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

.cal{border-collapse:separate;border-spacing:0;font-size:12.5px}
.cal th,.cal td{width:29px;min-width:29px;height:32px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
.cal th{font-weight:500;color:var(--muted);height:46px;line-height:1.25}
.cal .nm{position:sticky;left:0;z-index:1;background:var(--surface);min-width:160px;text-align:left;padding:0 14px;white-space:nowrap;font-weight:600}
.cal .we{background:var(--surface-2)}
.cal th.hoy{box-shadow:inset 0 -3px 0 var(--brand);color:var(--ink);font-weight:700}
.cal td.k0,.cal-k.k0{background:var(--pos-soft);color:var(--pos);font-weight:700}
.cal td.k1,.cal-k.k1{background:var(--warn-soft);color:var(--warn);font-weight:700}
.cal td.k2,.cal-k.k2{background:var(--brand-soft);color:var(--brand);font-weight:700}
.cal td.k3,.cal-k.k3{background:var(--neg-soft);color:var(--neg);font-weight:700}
.cal td.k4,.cal-k.k4{background:var(--line);color:var(--ink);font-weight:700}
.cal tr.tot td{background:var(--surface-2);font-weight:700}
.cal tr.tot td.multi{background:var(--warn-soft);color:var(--warn)}
.cal-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.cal-i{display:inline-flex;align-items:center;gap:6px}
.cal-k{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:5px;font-size:12px}
.rec{max-width:640px;margin:0 auto;border:1px solid var(--line);border-radius:10px;padding:26px;color:var(--ink)}
.rec-h{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.rec-h span,.rec-d span{display:block;font-size:12.5px;color:var(--muted)}
.rec-n{font-size:20px}.rec-r{text-align:right}
.rec h3{font-size:17px;margin:18px 0 10px}
.rec-d{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.rec-t{width:100%;border-collapse:collapse}.rec-t td{padding:7px 0;border-bottom:1px solid var(--line)}.rec-t .r{text-align:right}
.rec-neto{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:10px 0;border-top:2px solid var(--ink);font-size:18px}
.rec-neto b{font-size:24px}
.rec p{color:var(--ink);margin:6px 0}
.rec-f{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:64px}
.rec-f div{border-top:1px solid var(--ink);padding-top:6px;text-align:center;font-size:12.5px;color:var(--muted)}
.rec p.rec-x{margin-top:22px;font-size:12px;color:var(--muted)}
@media print{
  :root{--bg:#fff!important;--surface:#fff!important;--ink:#000!important;--muted:#444!important;--line:#999!important;padding:0!important}
  .app,#toast,.m-head,.m-foot{display:none!important}
  body{background:#fff}
  .overlay{position:static;background:none;padding:0;overflow:visible;display:block}
  .modal{box-shadow:none;border:0;width:100%;animation:none;background:#fff}
  .m-body{padding:0}
  .rec{border:1px solid #999}
}
.fs tr.tot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.fs tr.fin td{font-size:17px;border-top:2px solid var(--ink)}
.fs tr.sec td{font-weight:600;color:var(--muted);font-size:13px;background:transparent;padding-top:16px}
.fs td.ind{padding-left:30px}
.dia tr.ah td{background:var(--surface-2);border-top:1px solid var(--line)}
.dia td.cred{padding-left:34px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 34px;gap:8px;margin-bottom:8px}
@media (max-width:640px){.arow{grid-template-columns:minmax(0,1fr) 90px 90px 34px}}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:16px 12px}
  .brand{padding-bottom:12px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto}
  .side-foot{margin-top:10px}
  .s8,.s6,.s4{grid-column:span 12}
  .main{padding:22px 18px 60px}
}
@media (max-width:640px){
  .fgrid,.fgrid.c3{grid-template-columns:1fr}
  .irow,.ihead{grid-template-columns:minmax(0,1fr) 70px 100px 34px}
  .irow .sub,.ihead .h-sub{display:none}
  .hero-line{font-size:25px}
}
@media (prefers-reduced-motion:reduce){.modal{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="view"><div class="loading">Cargando…</div></main>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============ Datos y utilidades ============ */
const COLS=['productos','clientes','proveedores','cajas','ventas','compras','movs','empleados','asientos','cuentas','notas','gestiones','config'];
const S={}; COLS.forEach(c=>S[c]={});
const LS_KEY='gestion-negocio-v1';
let dbh=null, loaded=false, mode='cargando';
const ui={view:'reportes',period:'mes',vq:'',vestado:'',stab:'productos',sq:'',scat:'',sestado:'',cctab:'clientes',ccq:'',fcaja:'',fmes:'',rtab:'empleados',remp:'',rmes:'',calmes:'',ctab:'resultados',cper:'mes',cuenta:'',ivatab:'resumen',iper:'mes',ftab:'facturas',vfil:''};

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const sum=a=>a.reduce((x,y)=>x+y,0);
const money=n=>{n=r2(n);return (n<0?'-$ ':'$ ')+Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2});};
const qty=n=>r2(n).toLocaleString('es-AR',{maximumFractionDigits:3});
const pct=n=>r2(n).toLocaleString('es-AR',{maximumFractionDigits:1})+'%';
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' M':n>=1e3?Math.round(n/1e3)+' mil':String(Math.round(n));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=(n,l)=>String(n).padStart(l,'0');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const vals=c=>Object.values(S[c]);
const byName=(a,b)=>String(a.nombre).localeCompare(String(b.nombre),'es');
const byDateDesc=(a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.ts||0)-(a.ts||0);
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);}
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);}
const fdate=s=>{if(!s)return '';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);};
const MESES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const vnum=v=>'V-'+pad(v.n||0,4), cnum=c=>'C-'+pad(c.n||0,4);
const cliName=id=>(S.clientes[id]||{}).nombre||'';

let active=0;const waiters=[];
async function limited(fn){
  if(active>=4) await new Promise(r=>waiters.push(r));
  active++;
  try{
    for(let t=0;;t++){
      try{return await fn();}
      catch(e){ if(t<3&&e&&(e.code==='resource_exhausted'||e.code==='unavailable')){await sleep(400*(t+1));continue;} throw e; }
    }
  }finally{active--;const w=waiters.shift();if(w)w();}
}
const tails={};
function write(col,id,data){
  if(!dbh){saveLocal();return Promise.resolve();}
  const key=col+'/'+id;
  const run=()=>limited(()=>{const ref=dbh.collection(col).doc(id);return data===null?ref.delete():ref.set(data);});
  const p=(tails[key]||Promise.resolve()).then(run);
  tails[key]=p.catch(()=>{});
  p.catch(e=>toast(e&&e.code==='invalid_argument'?'No tenés permiso para guardar cambios en este tablero.':'No se pudo guardar. Revisá tu conexión e intentá de nuevo.'));
  return p;
}
function put(col,obj){obj=JSON.parse(JSON.stringify(obj));S[col][obj.id]=obj;write(col,obj.id,obj);scheduleRender();return obj;}
function del(col,id){delete S[col][id];write(col,id,null);scheduleRender();}
function subscribeAll(){
  const first=new Set();
  COLS.forEach(col=>{
    dbh.collection(col).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{const x=d.data();if(x)o[d.id]=x;});
      S[col]=o;
      if(!snap.metadata.fromCache){first.add(col);if(first.size===COLS.length)loaded=true;}
      scheduleRender();
    },()=>{first.add(col);if(first.size===COLS.length)loaded=true;scheduleRender();});
  });
  setTimeout(()=>{if(!loaded){loaded=true;scheduleRender();}},6000);
}

function compute(){
  const D={stock:{},cajas:{},cli:{},prov:{},vpend:{},cpend:{},inf:{},merged:{},hoy:todayStr()};
  vals('productos').forEach(p=>{D.stock[p.id]=num(p.stockInicial);});
  vals('cajas').forEach(k=>{D.cajas[k.id]=num(k.saldoInicial);});
  vals('clientes').forEach(c=>{D.cli[c.id]={saldo:0,cargos:[],pagado:0,ag:[0,0,0],ult:''};});
  vals('proveedores').forEach(c=>{D.prov[c.id]={saldo:0,cargos:[],pagado:0,ag:[0,0,0],ult:''};});
  const caja=(id,m)=>{if(id in D.cajas)D.cajas[id]+=m;};
  const mkInf=(d,cargo,c,kind,pid)=>{const i={id:d.id,kind,pid:pid||'',fecha:d.fecha,ts:d.ts||0,total:num(d.total),ndTot:0,ncTot:0,cobDir:0,rem:cargo>0.004?cargo:0};D.inf[d.id]=i;if(c)c.cargos.push(i);return i;};
  vals('ventas').forEach(v=>{
    if(v.anulada)return;
    (v.items||[]).forEach(it=>{if(it.productoId in D.stock)D.stock[it.productoId]-=num(it.cant);});
    if(num(v.entrega))caja(v.cajaId,num(v.entrega));
    const cargo=r2(num(v.total)-num(v.entrega)),c=D.cli[v.clienteId];
    mkInf(v,cargo,c,'venta',v.clienteId);
    if(c){c.saldo+=cargo;if(v.fecha>c.ult)c.ult=v.fecha;}
  });
  vals('compras').forEach(v=>{
    if(v.anulada)return;
    (v.items||[]).forEach(it=>{if(it.productoId in D.stock)D.stock[it.productoId]+=num(it.cant);});
    if(num(v.entrega))caja(v.cajaId,-num(v.entrega));
    const cargo=r2(num(v.total)-num(v.entrega)),c=D.prov[v.proveedorId];
    mkInf(v,cargo,c,'compra',v.proveedorId);
    if(c){c.saldo+=cargo;if(v.fecha>c.ult)c.ult=v.fecha;}
  });
  vals('notas').filter(n=>!n.anulada).sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.ts||0)-(b.ts||0)).forEach(n=>{
    const V=n.kind==='venta',NC=n.nota==='NC',ent=num(n.entrega),cred=r2(num(n.total)-ent);
    if(n.mueveStock)(n.items||[]).forEach(it=>{if(it.productoId in D.stock)D.stock[it.productoId]+=(V?1:-1)*num(it.cant);});
    if(ent)caja(n.cajaId,(V!==NC)?ent:-ent);
    const pid=(V?n.clienteId:n.proveedorId)||'',c=(V?D.cli:D.prov)[pid],ref=n.refId?D.inf[n.refId]:null,okRef=!!(ref&&ref.kind===n.kind&&ref.pid===pid);
    if(NC){
      if(c)c.saldo-=cred;
      let left=cred;
      if(okRef){const a=Math.min(cred,ref.rem);ref.rem=r2(ref.rem-a);ref.ncTot+=num(n.total);left=cred-a;}
      if(c)c.pagado+=left;
    }else{
      if(c)c.saldo+=cred;
      if(okRef){ref.rem=r2(ref.rem+cred);ref.ndTot+=num(n.total);D.merged[n.id]=n.refId;}
      else mkInf(n,cred,c,n.kind,pid);
    }
    if(c&&n.fecha>c.ult)c.ult=n.fecha;
  });
  const pagar=(m,x,kind)=>{
    const V=kind==='venta',pid=(V?m.clienteId:m.proveedorId)||'',c=(V?D.cli:D.prov)[pid];if(!c)return;
    c.saldo-=x;if(m.fecha>c.ult)c.ult=m.fecha;
    const ref=m.refId?D.inf[m.refId]:null;
    if(ref&&ref.kind===kind&&ref.pid===pid){const a=Math.min(x,ref.rem);ref.rem=r2(ref.rem-a);ref.cobDir+=a;c.pagado+=x-a;}
    else c.pagado+=x;
  };
  vals('movs').forEach(m=>{
    const x=num(m.monto);
    switch(m.tipo){
      case 'ajuste': if(m.productoId in D.stock)D.stock[m.productoId]+=num(m.cant);break;
      case 'cobro': caja(m.cajaId,x);pagar(m,x,'venta');break;
      case 'pago': caja(m.cajaId,-x);pagar(m,x,'compra');break;
      case 'gasto': case 'sueldo': case 'adelanto': caja(m.cajaId,-x);break;
      case 'ingreso': case 'ajustecaja': caja(m.cajaId,x);break;
      case 'transf': caja(m.cajaId,-x);caja(m.destinoId,x);break;
    }
  });
  const fifo=(map,pend)=>{
    Object.keys(map).forEach(id=>{
      const c=map[id];
      c.cargos.sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.ts-b.ts);
      let pay=c.pagado;
      c.cargos.forEach(i=>{
        const a=Math.min(i.rem,Math.max(pay,0));pay-=a;i.rem=r2(i.rem-a);pend[i.id]=i.rem;
        if(i.rem>0.004){const age=daysBetween(i.fecha,D.hoy);c.ag[age<=30?0:age<=60?1:2]+=i.rem;}
      });
      c.saldo=r2(c.saldo);
    });
  };
  fifo(D.cli,D.vpend);fifo(D.prov,D.cpend);
  return D;
}
function estadoDoc(kind,d,D){

  const i=D.inf[d.id];if(!i||i.rem<=0.004)return 'pagada';
  return (i.total+i.ndTot-i.rem)>0.004?'parcial':'pendiente';
}

function cashEvents(){
  const ev=[];
  vals('ventas').forEach(v=>{if(v.anulada||!num(v.entrega))return;ev.push({fecha:v.fecha,ts:v.ts||0,cajaId:v.cajaId,monto:num(v.entrega),desc:'Venta '+vnum(v)+(cliName(v.clienteId)?', '+cliName(v.clienteId):''),kind:'venta'});});
  vals('compras').forEach(v=>{if(v.anulada||!num(v.entrega))return;ev.push({fecha:v.fecha,ts:v.ts||0,cajaId:v.cajaId,monto:-num(v.entrega),desc:'Compra '+cnum(v)+(provName(v.proveedorId)?', '+provName(v.proveedorId):''),kind:'compra'});});
  vals('notas').forEach(n=>{if(n.anulada||!num(n.entrega))return;const V=n.kind==='venta',NC=n.nota==='NC',x=num(n.entrega);ev.push({fecha:n.fecha,ts:n.ts||0,cajaId:n.cajaId,monto:(V!==NC)?x:-x,desc:notaNombre(n)+', '+(V?cliName(n.clienteId):provName(n.proveedorId)),kind:'nota'});});
  vals('movs').forEach(m=>{
    const b={fecha:m.fecha,ts:m.ts||0,cajaId:m.cajaId,movId:m.id};const x=num(m.monto);
    if(m.tipo==='cobro')ev.push({...b,monto:x,desc:'Cobro de '+(cliName(m.clienteId)||'cliente'),kind:'cobro'});
    else if(m.tipo==='pago')ev.push({...b,monto:-x,desc:'Pago a '+(provName(m.proveedorId)||'proveedor'),kind:'pago'});
    else if(m.tipo==='gasto')ev.push({...b,monto:-x,desc:'Gasto: '+m.categoria+(m.nota?' – '+m.nota:''),kind:'gasto',cat:m.categoria});
    else if(m.tipo==='sueldo')ev.push({...b,monto:-x,desc:m.concepto+(m.periodo?' '+perTxt(m.periodo):'')+', '+empName(m.empleadoId),kind:'gasto',cat:'Sueldos'});
    else if(m.tipo==='adelanto')ev.push({...b,monto:-x,desc:'Adelanto a '+empName(m.empleadoId),kind:'gasto',cat:'Sueldos'});
    else if(m.tipo==='ingreso')ev.push({...b,monto:x,desc:(m.clase==='aporte'?'Aporte del dueño':m.clase==='prestamo'?'Préstamo recibido':'Ingreso')+(m.nota?': '+m.nota:''),kind:'ingreso'});
    else if(m.tipo==='ajustecaja')ev.push({...b,monto:x,desc:'Diferencia de caja'+(m.nota?' – '+m.nota:''),kind:'ajustecaja'});
    else if(m.tipo==='transf'){
      const o=(S.cajas[m.cajaId]||{}).nombre||'caja',d=(S.cajas[m.destinoId]||{}).nombre||'caja';
      ev.push({...b,monto:-x,desc:'Transferencia a '+d,kind:'transf'});
      ev.push({...b,cajaId:m.destinoId,monto:x,desc:'Transferencia desde '+o,kind:'transf'});
    }
  });
  return ev;
}
function range(p){
  const t=todayStr(),y=+t.slice(0,4),m=+t.slice(5,7),d=+t.slice(8,10);
  const ms=(yy,mm)=>yy+'-'+pad(mm,2)+'-01';
  const ml=(yy,mm)=>yy+'-'+pad(mm,2)+'-'+pad(new Date(yy,mm,0).getDate(),2);
  const py=m===1?y-1:y,pm=m===1?12:m-1;
  if(p==='mes'){const pd=Math.min(d,new Date(py,pm,0).getDate());return {from:ms(y,m),to:t,pf:ms(py,pm),pt:py+'-'+pad(pm,2)+'-'+pad(pd,2),lead:'Este mes',plabel:'el mismo tramo del mes anterior'};}
  if(p==='mesant'){const ppy=pm===1?py-1:py,ppm=pm===1?12:pm-1;return {from:ms(py,pm),to:ml(py,pm),pf:ms(ppy,ppm),pt:ml(ppy,ppm),lead:'El mes pasado',plabel:'el mes previo'};}
  if(p==='30')return {from:addDays(t,-29),to:t,pf:addDays(t,-59),pt:addDays(t,-30),lead:'En los últimos 30 días',plabel:'los 30 días anteriores'};
  if(p==='anio')return {from:y+'-01-01',to:t,pf:(y-1)+'-01-01',pt:(y-1)+t.slice(4),lead:'Este año',plabel:'el mismo tramo del año pasado'};
  return {from:'0000-01-01',to:t,pf:null,pt:null,lead:'Desde que empezaste',plabel:''};
}

function flujo(f,t){
  let ent=0,sal=0;const cat={};
  cashEvents().forEach(e=>{
    if(e.kind==='transf'||e.fecha<f||e.fecha>t)return;
    if(e.monto>0)ent+=e.monto;else sal-=e.monto;
    if(e.kind==='gasto'&&!CAT_MAP[e.cat])cat[e.cat]=(cat[e.cat]||0)-e.monto;
  });

}
function serie(vs,from,to){
  const days=daysBetween(from,to)+1,byM=days>45,m=new Map();
  if(!byM){for(let i=0;i<days;i++)m.set(addDays(from,i),0);}
  else{let y=+from.slice(0,4),mo=+from.slice(5,7);const ty=+to.slice(0,4),tm=+to.slice(5,7);while(y<ty||(y===ty&&mo<=tm)){m.set(y+'-'+pad(mo,2),0);mo++;if(mo>12){mo=1;y++;}}}
  vs.forEach(v=>{const k=byM?v.fecha.slice(0,7):v.fecha;m.set(k,(m.get(k)||0)+docNeto(v));});
  return [...m.entries()].map(([k,v])=>({k,v,label:byM?MESES[+k.slice(5,7)-1]+' '+k.slice(2,4):(+k.slice(8,10))+'/'+(+k.slice(5,7))}));
}
function niceMax(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;const st=[1,1.5,2,3,4,5,6,8,10];return (st.find(s=>s>=f)||10)*p;}
function barChart(s){
  const W=680,H=200,pl=46,pb=24,pt=10,pr=6,iw=W-pl-pr,ih=H-pb-pt;
  const max=Math.max(...s.map(x=>x.v),1),nice=niceMax(max),bw=iw/s.length;
  let g='';
  [0,.5,1].forEach(f=>{const y=pt+ih-ih*f;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+short(nice*f)+'</text>';});
  const step=Math.ceil(s.length/8);
  s.forEach((d,i)=>{
    const h=ih*d.v/nice,x=pl+i*bw+bw*.16,w=Math.max(bw*.68,1.5);
    g+='<rect x="'+x.toFixed(1)+'" y="'+(pt+ih-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(h,d.v>0?1.5:0).toFixed(1)+'" rx="2" fill="var(--brand)"><title>'+esc(d.label)+': '+money(d.v)+'</title></rect>';
    if(i%step===0)g+='<text x="'+(pl+i*bw+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+esc(d.label)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ventas del período">'+g+'</svg>';
}

/* ---------- Reportes ---------- */
function panel(t,inner,cls,extra){return '<section class="panel '+(cls||'')+'"><div class="panel-h"><h3>'+esc(t)+'</h3>'+(extra||'')+'</div>'+inner+'</section>';}
function viewReportes(D){
  const R=range(ui.period);
  const vs=ventasIn(R.from,R.to),ef=notasVentaEfecto(R.from,R.to),tot=r2(sumV(vs)+ef.rev),gan=r2(ganancia(vs)+ef.rev-ef.cmv),marg=tot?gan/tot*100:0;
  const prevTot=R.pf?r2(sumV(ventasIn(R.pf,R.pt))+notasVentaEfecto(R.pf,R.pt).rev):null;
  const cajasTot=sum(Object.values(D.cajas));
  const meDeben=sum(Object.values(D.cli).map(c=>Math.max(c.saldo,0)));
  const debo=sum(Object.values(D.prov).map(c=>Math.max(c.saldo,0)));
  let delta='';
  if(prevTot!==null){
    if(prevTot>0){const ch=(tot-prevTot)/prevTot*100;delta='<p class="delta '+(ch>=0?'pos-t':'neg-t')+'">'+pct(Math.abs(ch))+(ch>=0?' más':' menos')+' que '+R.plabel+'.</p>';}
    else if(tot>0)delta='<p class="delta mute">No hubo ventas en '+R.plabel+' para comparar.</p>';
  }
  const opts=[['mes','Este mes'],['mesant','Mes pasado'],['30','Últimos 30 días'],['anio','Este año'],['todo','Todo']].map(o=>'<option value="'+o[0]+'"'+(ui.period===o[0]?' selected':'')+'>'+o[1]+'</option>').join('');
  const acts='<select data-filter="period" aria-label="Período">'+opts+'</select>'+btn('export-ventas','Exportar ventas','sm')+btn('export-stock','Exportar stock','sm');
  const hero='<section class="hero"><p class="hero-line">'+esc(R.lead)+' vendiste <b>'+money(tot)+'</b>'+(ivaOn()?' sin IVA':'')+(tot?' y te quedó una ganancia bruta de <b>'+money(gan)+'</b> ('+pct(marg)+' de margen).':'.')+'</p>'+
    '<p class="hero-sub">Hoy tenés <b>'+money(cajasTot)+'</b> en cajas, te deben <b>'+money(meDeben)+'</b> y debés <b>'+money(debo)+'</b>.</p>'+delta+'</section>';

  const from=R.from==='0000-01-01'?(vs.length?vs.map(v=>v.fecha).sort()[0]:R.to):R.from;
  const ser=serie(vs.concat(notasComoVentas(from,R.to)),from,R.to);
  const chart=tot>0?barChart(ser):emptyBox('Sin ventas en este período','Cuando registres ventas vas a ver acá cómo evolucionan.');
  const fl=flujo(R.from,R.to),fm=Math.max(fl.ent,fl.sal,1),res=fl.ent-fl.sal;
  const cajasRows=vals('cajas').sort(byName).map(k=>'<div class="lrow"><span class="nm">'+esc(k.nombre)+'</span><b>'+money(D.cajas[k.id])+'</b></div>').join('');
  const flowP='<div class="flow-r"><span>Entró</span><b class="pos-t">'+money(fl.ent)+'</b></div><div class="hbar"><i style="width:'+(fl.ent/fm*100)+'%"></i></div>'+
    '<div class="flow-r"><span>Salió</span><b class="neg-t">'+money(fl.sal)+'</b></div><div class="hbar neg"><i style="width:'+(fl.sal/fm*100)+'%"></i></div>'+
    '<div class="flow-r"><span>Te quedó</span><b class="'+(res>=0?'pos-t':'neg-t')+'">'+money(res)+'</b></div>'+
    '<div class="sep"></div><p class="note" style="margin-bottom:4px">Saldo actual por caja</p>'+(cajasRows||'<p class="note">Todavía no hay cajas.</p>');
  const mp={};vs.forEach(v=>(v.items||[]).forEach(it=>{const o=mp[it.productoId]||(mp[it.productoId]={n:it.nombre,u:0,t:0});o.u+=num(it.cant);o.t+=it.neto!==undefined?num(it.neto):num(it.cant)*num(it.precio);}));
  const top=Object.values(mp).sort((a,b)=>b.u-a.u).slice(0,8),tmax=Math.max(1,...top.map(x=>x.u));
  const topP=top.length?top.map(x=>'<div class="lrow"><span class="nm">'+esc(x.n)+'</span><span><b>'+qty(x.u)+'</b> u. &nbsp;'+money(x.t)+'</span><div class="hbar"><i style="width:'+(x.u/tmax*100)+'%"></i></div></div>').join(''):'<p class="note">Sin ventas en este período.</p>';
  const crit=vals('productos').filter(p=>estStock(p,D)!=='ok').sort((a,b)=>(D.stock[a.id]-num(a.minimo))-(D.stock[b.id]-num(b.minimo))).slice(0,8);
  const critP=crit.length?crit.map(p=>{const e=estStock(p,D);return '<div class="lrow"><span class="nm">'+esc(p.nombre)+'</span><span>'+qty(D.stock[p.id])+' de '+qty(num(p.minimo))+' '+(e==='sin'?chip('Sin stock','neg'):chip('Bajo','warn'))+'</span></div>';}).join(''):'<p class="note">Ningún producto está por debajo de su mínimo.</p>';
  const debRows=(map,list,kind)=>{const r=list.filter(x=>map[x.id].saldo>0.004).sort((a,b)=>map[b.id].saldo-map[a.id].saldo).slice(0,5);return r.length?r.map(x=>'<div class="lrow"><button class="lbtn nm" data-action="ledger" data-kind="'+kind+'" data-id="'+esc(x.id)+'">'+esc(x.nombre)+'</button><span><b>'+money(map[x.id].saldo)+'</b> '+(map[x.id].ag[2]>0?chip('+60 días','neg'):'')+'</span></div>').join(''):'<p class="note">'+(kind==='cli'?'Nadie te debe plata.':'No le debés a nadie.')+'</p>';};
  const cats=Object.entries(fl.cat).sort((a,b)=>b[1]-a[1]),cmax=Math.max(1,...cats.map(c=>c[1]));
  const catP=cats.length?cats.map(c=>'<div class="lrow"><span class="nm">'+esc(c[0])+'</span><b>'+money(c[1])+'</b><div class="hbar neg"><i style="width:'+(c[1]/cmax*100)+'%"></i></div></div>').join(''):'<p class="note">Sin gastos en este período.</p>';
  return head('Reportes',acts)+hero+'<div class="grid">'+
    panel(ser.length&&daysBetween(from,R.to)+1>45?'Ventas por mes':'Ventas por día',chart,'s8')+
    panel('Flujo de fondos',flowP,'s4')+
    panel('Más vendidos',topP,'s6')+
    panel('Stock crítico',critP,'s6')+
    panel('Quién te debe',debRows(D.cli,vals('clientes'),'cli'),'s4')+
    panel('A quién le debés',debRows(D.prov,vals('proveedores'),'prov'),'s4')+
    panel('Gastos por categoría',catP,'s4')+'</div>';
}

  const cli=ui.cctab==='clientes',kind=cli?'cli':'prov',dm=cli?D.cli:D.prov;

  const list=all.filter(x=>!q||x.nombre.toLowerCase().includes(q)).sort((a,b)=>dm[b.id].saldo-dm[a.id].saldo||byName(a,b));
  const tot=sum(all.map(x=>Math.max(dm[x.id].saldo,0)));
  const ag=[0,1,2].map(i=>sum(all.map(x=>dm[x.id].ag[i])));
  const tab=(k,l)=>'<button role="tab" aria-selected="'+(ui.cctab===k)+'" data-action="set" data-k="cctab" data-v="'+k+'">'+l+'</button>';
  const rows=list.map(x=>{
    const c=dm[x.id],over=cli&&num(x.limite)>0&&c.saldo>num(x.limite);
    return '<tr><td><button class="lbtn" data-action="ledger" data-kind="'+kind+'" data-id="'+esc(x.id)+'"><b>'+esc(x.nombre)+'</b></button>'+(x.tel?'<span class="sub-l">'+esc(x.tel)+'</span>':'')+(!cli&&x.condiciones?'<span class="sub-l">'+esc(x.condiciones)+'</span>':'')+'</td>'+
    '<td class="r"><b class="'+(c.saldo>0.004?'neg-t':c.saldo<-0.004?'pos-t':'')+'">'+money(Math.abs(c.saldo))+'</b>'+(c.saldo<-0.004?'<span class="sub-l">a favor</span>':'')+'</td>'+
    (cli?'<td class="r">'+(num(x.limite)>0?money(x.limite):'Sin límite')+(over?'<span class="sub-l neg-t">Pasado del límite</span>':'')+'</td>':'')+
    '<td class="r">'+(c.ag[0]?money(c.ag[0]):'–')+'</td><td class="r">'+(c.ag[1]?money(c.ag[1]):'–')+'</td><td class="r"><b class="'+(c.ag[2]?'neg-t':'')+'">'+(c.ag[2]?money(c.ag[2]):'–')+'</b></td><td>'+(c.ult?fdate(c.ult):'–')+'</td>'+

  const f=ov.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=file]),select');if(f&&!o.noFocus)f.focus();

function closeOv(ov){if(!ov||!ov.isConnected)return;ov.remove();if(ov._onClose)ov._onClose();}

function openKardex(pid){
  const p=S.productos[pid];if(!p)return;const ev=[];
  vals('compras').forEach(c=>{if(c.anulada)return;(c.items||[]).forEach(i=>{if(i.productoId===pid)ev.push({fecha:c.fecha,ts:c.ts||0,det:'Compra '+cnum(c)+(provName(c.proveedorId)?', '+provName(c.proveedorId):''),d:num(i.cant)});});});
  vals('ventas').forEach(v=>{if(v.anulada)return;(v.items||[]).forEach(i=>{if(i.productoId===pid)ev.push({fecha:v.fecha,ts:v.ts||0,det:'Venta '+vnum(v)+(cliName(v.clienteId)?', '+cliName(v.clienteId):''),d:-num(i.cant)});});});
  vals('notas').forEach(n=>{if(n.anulada||!n.mueveStock)return;(n.items||[]).forEach(i=>{if(i.productoId===pid)ev.push({fecha:n.fecha,ts:n.ts||0,det:notaNombre(n),d:(n.kind==='venta'?1:-1)*num(i.cant)});});});

  ev.sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.ts-b.ts);

  const rows=ev.map(x=>{run+=x.d;return '<tr><td>'+fdate(x.fecha)+'</td><td>'+esc(x.det)+'</td><td class="r">'+(x.d>0?'<b class="pos-t">'+qty(x.d)+'</b>':'')+'</td><td class="r">'+(x.d<0?'<b class="neg-t">'+qty(-x.d)+'</b>':'')+'</td><td class="r"><b>'+qty(run)+'</b></td></tr>';}).join('');
  openModal({title:'Historial: '+p.nombre,wide:true,body:'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Detalle</th><th class="r">Entra</th><th class="r">Sale</th><th class="r">Stock</th></tr></thead><tbody><tr><td></td><td>Stock inicial</td><td></td><td></td><td class="r"><b>'+qty(num(p.stockInicial))+'</b></td></tr>'+rows+'</tbody></table></div>',footer:'<button class="btn primary" data-cancel>Cerrar</button>',onMount(ov){ov.querySelector('[data-cancel]').onclick=()=>closeOv(ov);}});

const MOTIVOS=[['Vacaciones','pos'],['Enfermedad','warn'],['Falta justificada','mute'],['Falta injustificada','neg'],['Licencia especial','mute']];
const motChip=m=>chip(m,(MOTIVOS.find(x=>x[0]===m)||['','mute'])[1]);
const perTxt=p=>p?MESES[+p.slice(5,7)-1]+' '+p.slice(0,4):'';
const years=(a,b)=>(parseD(b)-parseD(a))/86400000/365.25;
function antigTxt(ing){
  if(!ing)return '–';const d=daysBetween(ing,todayStr());if(d<0)return 'Ingresa el '+fdate(ing);
  const y=Math.floor(d/365.25),m=Math.floor((d-y*365.25)/30.44);
  const a=y?y+(y===1?' año':' años'):'',b=m?m+(m===1?' mes':' meses'):'';
  return a&&b?a+' y '+b:a||b||'Menos de 1 mes';
}
function vacDias(e,yr){
  if(!e.ingreso)return {dias:0,aprox:false};
  const ref=yr+'-12-31';if(e.ingreso>ref)return {dias:0,aprox:false};
  if(e.ingreso.slice(0,4)===String(yr)){const trab=daysBetween(e.ingreso,ref)+1;if(trab<183)return {dias:Math.floor(trab*5/7/20),aprox:true};}
  const y=years(e.ingreso,ref);
  return {dias:y<=5?14:y<=10?21:y<=20?28:35,aprox:false};
}
const vacTomadas=(id,yr)=>sum(vals('movs').filter(m=>m.tipo==='licencia'&&m.empleadoId===id&&m.motivo==='Vacaciones'&&(m.desde||'').slice(0,4)===String(yr)).map(m=>num(m.dias)));
const adelPend=id=>vals('movs').filter(m=>m.tipo==='adelanto'&&m.empleadoId===id&&!(m.liquidacionId&&S.movs[m.liquidacionId]));
const licHoy=(id,h)=>vals('movs').some(m=>m.tipo==='licencia'&&m.empleadoId===id&&m.desde<=h&&m.hasta>=h);
const activos=()=>vals('empleados').filter(e=>e.activo!==false).sort(byName);
const empOpts=(sel)=>activos().map(e=>opt(e.id,e.nombre,e.id===sel)).join('');
function detallePago(m){
  if(m.tipo==='adelanto')return 'Adelanto'+(m.nota?': '+m.nota:'');
  let s='Básico '+money(m.basico);
  if(num(m.adicionales))s+=', adicionales '+money(m.adicionales);
  if(num(m.descuentos))s+=', descuentos '+money(m.descuentos);
  if(num(m.adelantos))s+=', adelantos '+money(m.adelantos);
  return s;
}

    onInput(e){const ov=e.target.closest('.overlay'),n=e.target.name;if(n==='emp'||n==='concepto'||n==='periodo')suggest(ov);neto(ov);},
    userMount(ov){suggest(ov);neto(ov);},
    async onSave(ov){
      const e=S.empleados[gv(ov,'emp')],con=gv(ov,'concepto'),per=gv(ov,'periodo');

    }});
}

function enLetras(x){
  const abs=Math.abs(x);let n=Math.floor(abs+1e-9);const cent=Math.round((abs-n)*100);
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const Dz=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const Cn=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const m1000=k=>{if(k===100)return 'cien';const c=Math.floor(k/100),r=k%100;let s='';if(c)s+=Cn[c]+(r?' ':'');if(r<30)s+=U[r];else s+=Dz[Math.floor(r/10)]+(r%10?' y '+U[r%10]:'');return s;};
  const apo=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  let out=[];
  if(n===0)out.push('cero');
  const mill=Math.floor(n/1e6),mil=Math.floor((n%1e6)/1000),res=n%1000;
  if(mill)out.push(mill===1?'un millón':apo(m1000(mill))+' millones');
  if(mil)out.push(mil===1?'mil':apo(m1000(mil))+' mil');
  if(res)out.push(m1000(res));
  return out.join(' ')+(cent?' con '+pad(cent,2)+'/100':'');
}

const TIPOS_C={A:'Activo',P:'Pasivo',PN:'Patrimonio neto',I:'Ingresos',E:'Egresos'};
const byCod=(a,b)=>a.cod.localeCompare(b.cod,'es',{numeric:true});
const natural=(c,s)=>{s=s||{d:0,h:0};return (c.tipo==='A'||c.tipo==='E')?r2(s.d-s.h):r2(s.h-s.d);};
function cuentasMap(){
  const C={},add=(k,cod,nombre,tipo)=>{C[k]={k,cod,nombre,tipo};};
  vals('cajas').sort((a,b)=>(a.ts||0)-(b.ts||0)||byName(a,b)).forEach((c,i)=>add('caja:'+c.id,'1.1.'+pad(i+1,2),c.nombre,'A'));
  [['deudores','1.2.01','Deudores por ventas','A'],['iva_cred','1.6.01','IVA crédito fiscal','A'],['merc','1.3.01','Mercaderías','A'],['anticipos','1.4.01','Anticipos al personal','A'],['bienes','1.5.01','Bienes de uso','A'],['amort_ac','1.5.02','Amortización acumulada','A'],
   ['proveedores','2.1.01','Proveedores','P'],['iva_deb','2.1.03','IVA débito fiscal','P'],['imp_pagar','2.1.02','Impuestos a pagar','P'],['prestamos','2.2.01','Préstamos','P'],
   ['capital','3.1.01','Capital y aportes','PN'],['retiros','3.2.01','Retiros del dueño','PN'],
   ['ventas','4.1.01','Ventas','I'],['otros_ing','4.2.01','Otros ingresos','I'],
   ['cmv','5.1.01','Costo de mercaderías vendidas','E'],['dif_caja','5.3.01','Diferencias de caja','E'],['dif_inv','5.3.02','Diferencias de inventario','E'],['amort','5.4.01','Amortizaciones','E']].forEach(x=>add(x[0],x[1],x[2],x[3]));
  const usados=vals('movs').filter(m=>m.tipo==='gasto'&&m.categoria&&!CAT_MAP[m.categoria]).map(m=>m.categoria);
  const cats=['Sueldos'].concat([...new Set(CATS_GASTO.concat(usados))].filter(c=>c!=='Sueldos'&&!CAT_MAP[c]).sort((a,b)=>a.localeCompare(b,'es')));
  cats.forEach((c,i)=>add('gasto:'+c,'5.2.'+pad(i+1,2),c,'E'));
  const pref={A:'1.9.',P:'2.9.',PN:'3.9.',I:'4.9.',E:'5.9.'},cnt={};

function asientos(C){
  const out=[],cj=id=>'caja:'+id;
  const add=(fecha,ts,concepto,origen,L,extra)=>{
    L=L.filter(l=>Math.abs(l[1])>0.004||Math.abs(l[2])>0.004).map(l=>{if(!C[l[0]])C[l[0]]={k:l[0],cod:'9.9.99',nombre:'(cuenta eliminada)',tipo:'A'};return {k:l[0],d:r2(l[1]),h:r2(l[2])};});
    if(L.length)out.push(Object.assign({fecha,ts:ts||0,concepto,origen,lineas:L},extra||{}));
  };
  let f0=todayStr();
  ['ventas','compras','movs','asientos'].forEach(c=>vals(c).forEach(x=>{if(x.fecha&&x.fecha<f0)f0=x.fecha;}));
  const ap=[];let capital=0;
  vals('cajas').forEach(k=>{const s=num(k.saldoInicial);if(s){ap.push([cj(k.id),s>0?s:0,s<0?-s:0]);capital+=s;}});
  const m0=r2(sum(vals('productos').map(p=>num(p.stockInicial)*num(p.costoInicial!==undefined?p.costoInicial:p.costo))));
  if(m0){ap.push(['merc',m0,0]);capital+=m0;}
  capital=r2(capital);ap.push(['capital',capital<0?-capital:0,capital>0?capital:0]);
  add(f0,-1,'Asiento de apertura (saldos iniciales)','apertura',ap);
  vals('ventas').forEach(v=>{
    if(v.anulada)return;
    const total=num(v.total),ent=num(v.entrega),cmv=r2(sum((v.items||[]).map(i=>num(i.cant)*num(i.costo))));
    add(v.fecha,v.ts,'Venta '+vnum(v)+(cliName(v.clienteId)?', '+cliName(v.clienteId):''),'venta',[[cj(v.cajaId),ent,0],['deudores',r2(total-ent),0],['ventas',0,docNeto(v)],['iva_deb',0,r2(total-docNeto(v))],['cmv',cmv,0],['merc',0,cmv]]);
  });
  vals('compras').forEach(v=>{
    if(v.anulada)return;

const ivaDocs=(kind,f,t)=>{const ok=d=>!d.anulada&&d.fecha>=f&&d.fecha<=t&&d.iva!==undefined;return vals(kind==='v'?'ventas':'compras').filter(ok).concat(vals('notas').filter(n=>n.kind===(kind==='v'?'venta':'compra')&&ok(n)));};
const ivaDocsOrd=(kind,f,t)=>ivaDocs(kind,f,t).sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.ts||0)-(b.ts||0));
function ivaBuckets(docs){const B={};docs.forEach(d=>{const s=sgN(d);(d.items||[]).forEach(i=>{const a=String(num(i.alic)),b=B[a]||(B[a]={neto:0,iva:0});b.neto+=s*num(i.neto);b.iva+=s*num(i.iva);});});return B;}
const alicTxt=a=>num(a)===0?'0% (exento o no gravado)':qty(num(a))+'%';
function libroRows(kind,R){
  const V=kind==='v';
  return ivaDocsOrd(kind,R.from,R.to).map(d=>{
    let ng=0,ne=0,i21=0,i105=0,i27=0,io=0;const s=sgN(d);
    (d.items||[]).forEach(i=>{const a=num(i.alic),n=s*num(i.neto),v=s*num(i.iva);if(a>0)ng+=n;else ne+=n;if(a===21)i21+=v;else if(a===10.5)i105+=v;else if(a===27)i27+=v;else if(a>0)io+=v;});
    const p=V?S.clientes[d.clienteId]:S.proveedores[d.proveedorId];
    return {fecha:d.fecha,comp:compTxt(d)||(d.nota?notaNum(d):(V?vnum(d):cnum(d))),cod:codArca(d),tname:tipoName(d),tipo:d.tipoComp||'',pv:d.pv||'',nro:d.nro||'',party:(p&&p.nombre)||(V?'Consumidor final':'Sin proveedor'),cuit:(p&&p.cuit)||'',ng:r2(ng),ne:r2(ne),i21:r2(i21),i105:r2(i105),i27:r2(i27),io:r2(io),tot:s*num(d.total)};
  });
}
function controlesIva(R){
  const out=[],vd=ivaDocs('v',R.from,R.to),cd=ivaDocs('c',R.from,R.to);
  const sv=vd.filter(d=>!d.nro).length,sc=cd.filter(d=>!d.nro).length;
  if(sv)out.push(sv+(sv===1?' venta sin número':' ventas sin número')+' de comprobante.');
  if(sc)out.push(sc+(sc===1?' compra sin número':' compras sin número')+' de comprobante.');
  const ba=vd.filter(d=>d.tipoComp==='A'&&!cuitOk((S.clientes[d.clienteId]||{}).cuit)).length;
  const bc=cd.filter(d=>d.tipoComp==='A'&&!cuitOk((S.proveedores[d.proveedorId]||{}).cuit)).length;
  if(ba)out.push(ba+(ba===1?' factura A de venta sin':' facturas A de venta sin')+' CUIT válido del cliente.');
  if(bc)out.push(bc+(bc===1?' factura A de compra sin':' facturas A de compra sin')+' CUIT válido del proveedor.');
  const g={};vals('ventas').concat(vals('notas').filter(n=>n.kind==='venta')).forEach(v=>{if(!v.anulada||true){if(v.tipoComp&&v.pv&&v.nro){const k=(v.nota||'F')+'|'+v.tipoComp+'|'+v.pv;(g[k]=g[k]||new Set()).add(parseInt(v.nro,10));}}});
  Object.keys(g).forEach(k=>{
    const a=[...g[k]].sort((x,y)=>x-y),miss=[];
    for(let i=1;i<a.length;i++)for(let n=a[i-1]+1;n<a[i]&&miss.length<50;n++)miss.push(n);
    if(miss.length){const p=k.split('|');out.push('Faltan números en '+(p[0]==='F'?tipoTxt(p[1]):(p[0]==='NC'?'Nota de crédito ':'Nota de débito ')+p[1])+' '+p[2]+': '+miss.slice(0,5).map(n=>pad(n,8)).join(', ')+(miss.length>5?' y más':'')+'.');}
  });
  return out;
}
function controlesHtml(R){
  const out=controlesIva(R);

/* ============ Cobranzas y vencimientos ============ */
const plazoOf=(kind,pid)=>{const p=(kind==='venta'?S.clientes:S.proveedores)[pid];return p&&p.plazo!==undefined&&p.plazo!==''?num(p.plazo):(cfg().plazo!==undefined?num(cfg().plazo):30);};
const venceDoc=i=>{const d=S.ventas[i.id]||S.compras[i.id]||S.notas[i.id];return (d&&d.vence)||addDays(i.fecha,plazoOf(i.kind,i.pid));};
const cctabs=()=>'<div class="tabs" role="tablist">'+[['clientes','Clientes'],['proveedores','Proveedores'],['cobranzas','Cobranzas'],['pagos','Pagos a proveedores']].map(t=>'<button role="tab" aria-selected="'+(ui.cctab===t[0])+'" data-action="set" data-k="cctab" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
function promesaDe(pid,hoy){
  const gs=vals('gestiones').filter(g=>g.clienteId===pid).sort((a,c)=>(c.fecha||'').localeCompare(a.fecha||'')||(c.ts||0)-(a.ts||0));
  const pr=gs.find(g=>g.promesaFecha)||null;let est='';
  if(pr){
    const cob=sum(vals('movs').filter(m=>m.tipo==='cobro'&&m.clienteId===pid&&m.fecha>=pr.fecha).map(m=>num(m.monto))),meta=num(pr.promesaMonto);
    est=(meta>0?cob>=meta-0.01:cob>0)?'cumplida':(pr.promesaFecha>=hoy?'pendiente':'incumplida');
  }
  return {ult:gs[0]||null,pr,est,gs};
}
function vencData(D,kind){
  const hoy=D.hoy,by={};
  Object.values(D.inf).forEach(i=>{
    if(i.kind!==kind||!i.pid||i.rem<=0.004)return;
    const due=venceDoc(i),dias=daysBetween(due,hoy);
    const b=by[i.pid]||(by[i.pid]={pid:i.pid,docs:[],venc:0,pv:0,total:0,maxDias:0,nVenc:0});
    b.docs.push({id:i.id,fecha:i.fecha,due,dias,rem:i.rem});b.total=r2(b.total+i.rem);
    if(dias>0){b.venc=r2(b.venc+i.rem);b.nVenc++;if(dias>b.maxDias)b.maxDias=dias;}else b.pv=r2(b.pv+i.rem);
  });
  return Object.values(by).map(b=>{
    b.docs.sort((x,y)=>x.due.localeCompare(y.due));
    b.prom=kind==='venta'?promesaDe(b.pid,hoy):null;
    const roto=b.prom&&b.prom.est==='incumplida'&&b.venc>0.004;
    b.prio=(roto||b.maxDias>60)?4:b.maxDias>30?3:b.maxDias>0?2:1;
    return b;
  }).sort((a,b)=>b.prio-a.prio||b.venc-a.venc||b.total-a.total);
}

function waNumero(tel){
  let d=String(tel||'').replace(/\D/g,'');if(!d)return '';
  if(d.startsWith('54'))return d;
  d=d.replace(/^0+/,'');
  if(d.length===10)return '549'+d;
  const m=d.match(/^(\d{2,4})15(\d{6,8})$/);if(m&&(m[1]+m[2]).length===10)return '549'+m[1]+m[2];
  return d;
}

    mk('notas',{kind:'venta',nota:'ND',n:1,refId:'',fecha:addDays(t,-4),clienteId:cli2.id,motivo:'Intereses o gastos',items:[{productoId:'',nombre:'Intereses por pago fuera de término',cant:1,precio:5000,costo:0,alic:21,neto:l2.neto,iva:l2.iva}],total:l2.total,neto:l2.neto,iva:l2.iva,ivaModo:'neto',entrega:0,pago:'cuenta',cajaId:'',tipoComp:'A',pv:'00001',nro:pad(1,8),comprobante:'00001-'+pad(1,8),mueveStock:false,anulada:false});
    const c0=vals('compras').sort((a,b)=>a.fecha.localeCompare(b.fecha))[0],l3=calcLinea(1,8000,21,false);
    if(c0)mk('notas',{kind:'compra',nota:'NC',n:1,refId:c0.id,fecha:addDays(t,-8),proveedorId:c0.proveedorId,motivo:'Descuento o bonificación',items:[{productoId:'',nombre:'Bonificación por volumen',cant:1,costo:8000,alic:21,neto:l3.neto,iva:l3.iva}],total:l3.total,neto:l3.neto,iva:l3.iva,ivaModo:'neto',entrega:0,pago:'cuenta',cajaId:'',tipoComp:'A',pv:'00003',nro:pad(88,8),comprobante:'00003-'+pad(88,8),mueveStock:false,anulada:false});
  }
  [[cl[3],-52,4,6],[cl[1],-40,5,5],[cl[2],-75,4,4]].forEach(x=>{
    const p=prods[x[2]],c=x[3];if(stock[p.id]<c+2)return;stock[p.id]-=c;
    const l=calcLinea(c,p.precio,p.alic,true),tc=x[0].condIva==='RI'||x[0].condIva==='MT'?'A':'B';cntV[tc]=(cntV[tc]||0)+1;
    mk('ventas',{n:nextNum('ventas'),fecha:addDays(t,x[1]),clienteId:x[0].id,items:[{productoId:p.id,nombre:p.nombre,cant:c,precio:p.precio,costo:p.costo,alic:p.alic,neto:l.neto,iva:l.iva}],total:l.total,neto:l.neto,iva:l.iva,ivaModo:'incl',entrega:0,pago:'cuenta',cajaId:'',tipoComp:tc,pv:'00001',nro:pad(cntV[tc],8),comprobante:'00001-'+pad(cntV[tc],8),anulada:false});
  });
  {
    const D2=compute(),deu=cl.map(c=>({c,s:D2.cli[c.id].saldo})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
    if(deu[0]){mk('gestiones',{clienteId:deu[0].c.id,fecha:addDays(t,-9),medio:'Llamado',nota:'Dijo que pagaba la semana pasada',promesaFecha:addDays(t,-3),promesaMonto:Math.round(deu[0].s/2/100)*100});}
    if(deu[1]){mk('gestiones',{clienteId:deu[1].c.id,fecha:addDays(t,-2),medio:'WhatsApp',nota:'Confirmó que transfiere',promesaFecha:addDays(t,4),promesaMonto:Math.round(deu[1].s/100)*100});}
  }
  mk('movs',{tipo:'gasto',fecha:addDays(t,-30),monto:450000,cajaId:cj['Banco'].id,categoria:'Compra de bienes de uso',nota:'Heladera exhibidora'});
  mk('asientos',{fecha:pmd,concepto:'Amortización mensual de bienes de uso',lineas:[{k:'amort',d:7500,h:0},{k:'amort_ac',d:0,h:7500}]});
  ui.view='reportes';
}
function openAjustes(){
  formModal({title:'Ajustes y copias',saveLabel:'Guardar cambios',
    body:F.t('Nombre del negocio','nombre',cfg().nombre||'','','full').replace('<label','<label style="margin-bottom:6px"')+'<div class="sep"></div><label class="chk" style="margin-top:0"><input type="checkbox" name="ivaon"'+(cfg().iva?' checked':'')+'> Llevo IVA (soy responsable inscripto)</label><div class="fgrid" style="margin-top:12px">'+F.s('Precios de venta','ivamodo',opt('incl','Incluyen IVA',cfg().ivaModo!=='neto')+opt('neto','No incluyen IVA (se suma aparte)',cfg().ivaModo==='neto'))+F.s('Alícuota por defecto','alic',ALICS.map(a=>opt(String(a),alicTxt(a),a===alicDef())).join(''))+F.n('Punto de venta por defecto','pv',cfg().pv||1,'min="1" max="99999"')+'</div><p class="hint">Los costos de compra se cargan siempre sin IVA. Si no llevás IVA, dejalo desactivado y el sistema trabaja con precios finales.</p><div class="fgrid" style="margin-top:12px">'+F.n('Plazo de pago por defecto (días)','plazo',cfg().plazo!==undefined?cfg().plazo:30,'min="0"')+'</div><p class="hint">Se usa para calcular el vencimiento de las facturas cuando el cliente o el proveedor no tiene un plazo propio.</p><div class="sep"></div><p style="margin-bottom:12px">Bajá una copia de todos tus datos para tenerla de respaldo, o restaurá una anterior.</p><div class="btnrow"><button class="btn" data-dl>Descargar copia</button><label class="btn" style="cursor:pointer">Restaurar copia<input type="file" accept=".json,application/json" data-restore hidden></label></div><div class="sep"></div><div class="btnrow"><button class="btn" data-sample>Cargar datos de ejemplo</button><button class="btn danger" data-wipe>Borrar todos los datos</button></div>',
    userMount(ov){
      ov.querySelector('[data-dl]').onclick=()=>saveFile('copia-gestion-'+todayStr()+'.json',JSON.stringify(S));
      ov.querySelector('[data-restore]').onchange=async e=>{
        const f=e.target.files[0];if(!f)return;
        try{
          const o=JSON.parse(await f.text());if(!o||typeof o!=='object'||!(o.productos||o.ventas||o.cajas))throw new Error('x');
          if(!await askConfirm('Restaurar copia','Se reemplazan todos los datos actuales por los de la copia.','Restaurar',true))return;
          wipeAll();COLS.forEach(c=>Object.values(o[c]||{}).forEach(d=>{if(d&&d.id)put(c,d);}));
          closeOv(ov);toast('Copia restaurada');
        }catch(err){showErr(ov,'Ese archivo no parece una copia de seguridad de este sistema.');}
      };
      ov.querySelector('[data-sample]').onclick=async()=>{if(await askConfirm('Cargar datos de ejemplo','Se suman productos, clientes y movimientos de ejemplo a tus datos.','Cargar')){loadSample();closeOv(ov);toast('Datos de ejemplo cargados');}};
      ov.querySelector('[data-wipe]').onclick=async()=>{if(await askConfirm('Borrar todos los datos','Se borran productos, clientes, ventas, cajas y todo lo demás. No se puede deshacer.','Borrar todo',true)){wipeAll();closeOv(ov);toast('Datos borrados');}};
    },
    onSave(ov){const n=gv(ov,'nombre').trim();put('config',{...cfg(),id:'negocio',nombre:n||'Mi negocio',started:true,iva:ov.querySelector('[name=ivaon]').checked,ivaModo:gv(ov,'ivamodo'),alic:num(gv(ov,'alic')),pv:Math.max(1,parseInt(gv(ov,'pv'),10)||1),plazo:Math.max(0,parseInt(gv(ov,'plazo'),10)||0)});closeOv(ov);toast('Cambios guardados');}});
}

/* ============ Eventos ============ */
const actions={
  go:el=>go(el.dataset.v),
  set:el=>{ui[el.dataset.k]=el.dataset.v;render();},
  close:el=>closeOv(el.closest('.overlay')),
  start:()=>{const n=($('#w-nombre')||{}).value||'';startEmpty(n.trim());},
  sample:()=>{loadSample();toast('Datos de ejemplo cargados');},
  'new-venta':()=>openDoc('venta'),'new-compra':()=>openDoc('compra'),
  'ver-doc':el=>openDocView(el.dataset.kind,el.dataset.id),
  'new-producto':()=>openProducto(),'edit-producto':el=>openProducto(el.dataset.id),
  kardex:el=>openKardex(el.dataset.id),ajuste:()=>openAjuste(),
  'new-cliente':()=>openParty('cli'),'new-prov':()=>openParty('prov'),
  ledger:el=>openLedger(el.dataset.kind,el.dataset.id),
  cobro:el=>openPagoCC('cobro',el.dataset.id),pago:el=>openPagoCC('pago',el.dataset.id),
  gasto:()=>openGasto(),ingreso:()=>openIngreso(),transf:()=>openTransf(),
  'new-caja':()=>openCaja(),'edit-caja':el=>openCaja(el.dataset.id),conciliar:el=>openConciliar(el.dataset.id),
  'del-mov':async el=>{
    const ov=el.closest('.overlay'),led=ov&&ov.dataset.ledger,id=el.dataset.id;
    if(await askConfirm('Eliminar movimiento','Se deshace este movimiento y los saldos se recalculan.','Eliminar',true)){
      del('movs',id);toast('Movimiento eliminado');
      if(led){closeOv(ov);const p=led.split(':');openLedger(p[0],p[1]);}
    }
  },
  'new-empleado':()=>openEmpleado(),'edit-empleado':el=>openEmpleado(el.dataset.id),ficha:el=>openFicha(el.dataset.id),liquidar:el=>openLiquidar(el.dataset.id),adelanto:el=>openAdelanto(el.dataset.id),licencia:el=>openLicencia(el.dataset.id),
  recibo:el=>openRecibo(el.dataset.id),
  'cal-prev':()=>{const c=ui.calmes||todayStr().slice(0,7),d=new Date(+c.slice(0,4),+c.slice(5,7)-2,1);ui.calmes=d.getFullYear()+'-'+pad(d.getMonth()+1,2);render();},
  'cal-next':()=>{const c=ui.calmes||todayStr().slice(0,7),d=new Date(+c.slice(0,4),+c.slice(5,7),1);ui.calmes=d.getFullYear()+'-'+pad(d.getMonth()+1,2);render();},
  'cal-hoy':()=>{ui.calmes='';render();},
  'new-asiento':()=>openAsiento(),'new-cuenta':()=>openCuenta(),'edit-cuenta':el=>openCuenta(el.dataset.id),'export-diario':()=>exportDiario(),
  'del-asiento':async el=>{if(await askConfirm('Eliminar asiento','Se elimina este asiento manual y los saldos se recalculan.','Eliminar',true)){del('asientos',el.dataset.id);toast('Asiento eliminado');}},
  'export-iva':el=>exportLibroIva(el.dataset.kind),
  'iva-compensar':async el=>{const m=num(el.dataset.m);if(m>0&&await askConfirm('Compensar IVA','Se crea un asiento que compensa '+money(m)+' de IVA débito fiscal con IVA crédito fiscal.','Compensar')){put('asientos',{id:uid(),ts:Date.now(),fecha:el.dataset.fecha,concepto:'Compensación de IVA',lineas:[{k:'iva_deb',d:m,h:0},{k:'iva_cred',d:0,h:m}]});toast('Asiento de compensación creado');}},
  'new-nota':el=>openNota(el.dataset.kind,el.dataset.nota),'ver-nota':el=>openNotaView(el.dataset.id),
  'venc-det':el=>openVencDetalle(el.dataset.kind,el.dataset.id),gestion:el=>openGestion(el.dataset.id),recordatorio:el=>openRecordatorio(el.dataset.id),
  ajustes:()=>openAjustes(),'export-ventas':()=>exportVentas(),'export-stock':()=>exportStock()
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const f=actions[el.dataset.action];if(f)f(el,e);});
function onField(e){
  const el=e.target;
  if(el.dataset&&el.dataset.filter){ui[el.dataset.filter]=el.value;render();return;}
  const ov=el.closest&&el.closest('.overlay');if(ov&&ov._onInput)ov._onInput(e);
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const all=document.querySelectorAll('.overlay');if(all.length)closeOv(all[all.length-1]);}});

/* ============ Inicio ============ */
async function init(){
  ui.fmes='';
  render();
  let db=null;
  try{if(window.claude&&window.claude.use)db=await window.claude.use('db');}catch(e){db=null;}
  if(db){dbh=db;mode='nube';subscribeAll();}
  else{mode='local';loadLocal();loaded=true;render();}
}
init();
</script>
